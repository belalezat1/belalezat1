name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render snake over the contribution graph
        # Platane/snk@v3.5.0
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Match the profile card sunset accents (#ffb066 dark / #b35900 light).
          outputs: |
            dist/github-snake.svg?color_snake=#b35900
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb066

      - name: Publish to the output branch
        # crazy-max/ghaction-github-pages@v4.0.0
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
